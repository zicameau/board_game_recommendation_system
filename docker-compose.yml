services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bgg
      POSTGRES_PASSWORD: bgg
      POSTGRES_DB: bgg_dev
    # Host 5433: avoids clash when Windows/local Postgres already uses 5432
    ports:
      - "5433:5432"
    volumes:
      - bgg-pgdata:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgg -d bgg_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  bgg-pgdata:
